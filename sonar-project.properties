# SonarCloud (SonarQube Cloud) analysis config — fairyfox ci-secrets: SONAR_TOKEN.
# C/C++ analysis is driven by the compilation database the CMake build already emits
# (CMAKE_EXPORT_COMPILE_COMMANDS is forced ON in projects/CMakeLists.txt) — no build-wrapper
# needed. The org/project keys follow SonarCloud's GitHub-import convention; adjust them to
# whatever the SonarCloud project is actually created as (Administration -> Analysis Method).
sonar.organization=junebug12851
sonar.projectKey=junebug12851_pokered-save-editor-2
sonar.projectName=Pokered Save Editor 2

sonar.sources=projects
sonar.tests=projects/tests
sonar.sourceEncoding=UTF-8

# Point the C-family analyzer at the build's compilation database.
sonar.cfamily.compile-commands=build/compile_commands.json

# Don't analyze generated, vendored, or asset trees (they aren't hand-written source).
sonar.exclusions=**/build/**,**/*_autogen/**,**/moc_*,**/qrc_*,**/*.moc,projects/**/assets/**,assets/**,docs/**
sonar.coverage.exclusions=projects/tests/**
